<svg width="1280" height="440" viewBox="0 0 1280 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Concile — the backend that keeps your data alive">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080B14"/>
      <stop offset="0.55" stop-color="#0C1120"/>
      <stop offset="1" stop-color="#0A0E1A"/>
    </linearGradient>
    <radialGradient id="glow" cx="640" cy="210" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0A0E1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="380" y1="150" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8FBFF"/>
      <stop offset="0.55" stop-color="#7DE3F4"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="440" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="20" fill="url(#glow)"/>

  <!-- reconcile ripples: two sources converging into one live signal -->
  <g stroke="#22D3EE" fill="none" opacity="0.14">
    <circle cx="640" cy="210" r="70"/>
    <circle cx="640" cy="210" r="130"/>
    <circle cx="640" cy="210" r="200" opacity="0.6"/>
    <circle cx="640" cy="210" r="280" opacity="0.35"/>
  </g>

  <!-- the live heartbeat line -->
  <path d="M120 210 H430 l24 -46 24 92 22 -150 26 208 20 -104 H700 l22 -34 20 68 22 -120 24 168 18 -82 H1160"
        stroke="url(#pulse)" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
  <circle cx="700" cy="210" r="5" fill="#22D3EE"/>

  <!-- wordmark -->
  <text x="640" y="238" text-anchor="middle"
        font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif"
        font-size="132" font-weight="800" letter-spacing="-4" fill="url(#ink)">concile</text>

  <!-- tagline -->
  <text x="640" y="298" text-anchor="middle"
        font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif"
        font-size="27" font-weight="500" letter-spacing="0.5" fill="#9FB0C9">the backend that keeps your data alive</text>

  <!-- install pill -->
  <g>
    <rect x="512" y="336" width="256" height="46" rx="23" fill="#0E1526" stroke="#22D3EE" stroke-opacity="0.35"/>
    <text x="640" y="365" text-anchor="middle"
          font-family="'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace"
          font-size="20" font-weight="600" fill="#7DE3F4">$ npm i concile</text>
  </g>
</svg>
