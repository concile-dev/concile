name: E2E

on:
  # Runs on PRs so a broken fleet, storage or outbox path is caught before it lands, not an hour
  # after. Kept on push to main as well, deliberately: a PR's run tests that PR merged onto main
  # as of that moment, so once another PR lands in between, the combination that actually
  # reaches main has not been exercised. main is what the release job and Vercel ship from, so it
  # gets its own verdict. merge_group is the hook for a merge queue if one is enabled later.
  #
  # Not a required check yet. Make it required only after watching its failure rate on real PRs:
  # a required lane that flakes trains people to re-run without reading, and then it gates nothing.
  # Note for that day: with paths-ignore, a docs-only PR produces no check at all, and a missing
  # required check blocks the merge. Requiring it means dropping paths-ignore in favour of a
  # change-detection step inside the job.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "www/**"
      - "docs/**"
      - ".changeset/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "www/**"
      - "docs/**"
      - ".changeset/**"
  merge_group:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: serial e2e lane
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      # The vitest lane runs under Node, not Bun, and parts of it load the experimental
      # `node:sqlite`. Pin the version .nvmrc declares, as ci.yml does, instead of whatever
      # the runner ships.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: bun-turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            bun-turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            bun-turbo-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:e2e
