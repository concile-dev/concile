name: E2E

on:
  # Runs on pull requests, so a broken fleet, storage or outbox path is caught before it lands,
  # not an hour after. Not on push to main: branch protection requires a PR to be up to date with
  # main before it can merge, so the tree that lands is exactly the tree the PR run tested, and a
  # second run would only repeat it. (A direct push to main bypassing PRs gets no checks from any
  # workflow; the fix for that is "enforce for admins" in branch protection, not a duplicate run.)
  # merge_group is the hook for a merge queue if one is enabled later.
  #
  # Not a required check yet. Make it required only after watching its failure rate on real PRs:
  # a required lane that flakes trains people to re-run without reading, and then it gates nothing.
  # Note for that day: with paths-ignore, a docs-only PR produces no check at all, and a missing
  # required check blocks the merge. Requiring it means dropping paths-ignore in favour of a
  # change-detection step inside the job.
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "www/**"
      - "docs/**"
      - ".changeset/**"
  merge_group:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: serial e2e lane
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      # The vitest lane runs under Node, not Bun, and parts of it load the experimental
      # `node:sqlite`. Pin the version .nvmrc declares, as ci.yml does, instead of whatever
      # the runner ships.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: bun-turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            bun-turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            bun-turbo-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:e2e
