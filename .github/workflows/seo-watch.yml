name: SEO watch

# Weekly technical crawl of the live site against a committed baseline.
# Catches lost canonicals, new redirects, sitemap 404s and missing share
# images within a week. Opens one issue per regression run; a deliberate
# change updates the baseline with `node scripts/seo-watch.mjs --write`.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm i -g seo
      - id: watch
        run: node scripts/seo-watch.mjs
      - if: failure() && steps.watch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "SEO watch: regression on $(date -u +%Y-%m-%d)" \
            --label seo \
            --body-file seo-watch-report.md
